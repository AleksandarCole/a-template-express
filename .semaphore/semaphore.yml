version: v1.0
name: "\U0001F4AB Elixir Insight ETL - CI Pipeline"
agent:
  machine:
    type: s1-kubernetes
    os_image: ''
  containers:
    - name: main
      image: 'node:18'
    - name: postgres
      image: 'postgres:15'
      env_vars:
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_DB
          value: app_test
    - name: redis
      image: 'redis:7.0'
global_job_config:
  prologue:
    commands:
      - checkout
      - npm install
blocks:
  - name: "\U0001F50D Lint & Code Quality"
    task:
      jobs:
        - name: ESLint
          commands:
            - npm run lint
  - name: "\U0001F512 Security Scan"
    task:
      jobs:
        - name: NPM Audit
          commands:
            - npm audit --production
        - name: Node Check Outdated
          commands:
            - npm outdated
  - name: "\U0001F9EA Tests in Parallel"
    task:
      jobs:
        - name: API Tests
          commands:
            - 'npm run test:api'
        - name: Integration Tests
          commands:
            - 'npm run test:integration'
        - name: E2E Tests
          commands:
            - 'npm run test:e2e'
  - name: "\U0001F4DD Documentation"
    task:
      jobs:
        - name: Generate Docs
          commands:
            - 'if npm run | grep -q "docs"; then npm run docs; elif npm run | grep -q "doc"; then npm run doc; else echo "No docs script found, skipping documentation generation"; fi'
