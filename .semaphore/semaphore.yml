version: v1.0
name: Node.js Pipeline
agent:
  machine:
    type: s1-kubernetes
    os_image: ''
  containers:
    - name: main
      image: 'node:18'
    - name: postgres
      image: 'postgres:15'
    - name: redis
      image: 'redis:7.0'
global_job_config:
  prologue:
    commands:
      - checkout
      - export NODE_ENV=test
      - 'export REDIS_URL=redis://redis:6379'
      - 'export DATABASE_URL=postgres://postgres:postgres@postgres:5432/app_test'
      - export POSTGRES_PASSWORD=postgres
      - export POSTGRES_DB=app_test
      - cache restore node-modules-$SEMAPHORE_GIT_BRANCH-$(checksum package.json)
      - npm ci
      - cache store node-modules-$SEMAPHORE_GIT_BRANCH-$(checksum package.json) node_modules
blocks:
  - name: "\U0001F50D Lint & Code Quality"
    task:
      jobs:
        - name: ESLint
          commands:
            - npm run lint
  - name: "\U0001F9EA Tests in Parallel"
    task:
      jobs:
        - name: Core Tests
          commands:
            - npm run test
        - name: Acceptance Tests
          commands:
            - TEST_GREP="acceptance" npm run test
        - name: Router Tests
          commands:
            - TEST_GREP="Router" npm run test
        - name: Request Tests
          commands:
            - TEST_GREP="req" npm run test
  - name: "\U0001F9E9 Additional Testing"
    task:
      jobs:
        - name: Benchmarks
          commands:
            - npm run bench
  - name: "\U0001F4DD Documentation"
    task:
      jobs:
        - name: Generate Docs
          commands:
            - npm run docs
            - echo "Documentation generated successfully."
